aid: transparentbusiness
name: TransparentBusiness
description: 'TransparentBusiness is a New York based SaaS company, founded in 2012 by Alex Konanykhin
  and Silvina Moschini, that sells a cloud platform for managing and monitoring remote workforces: a
  desktop timer, screenshot-based activity verification, timesheets, task assignment, and real-time
  project cost and progress reporting for distributed teams and contractors. The company also operates
  the SheWorks! and Yandiki talent marketplaces and the CloudWorking Academy training platform, and was
  later renamed Unicoin, Inc. The product is delivered as a hosted web application plus downloadable
  desktop timer clients; the company publishes no public developer program, API reference, SDK, or
  machine-readable specification.'
